<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title> lists</title>
</head>
<body>
    <h1> An ordered html List</h1>
    <ol>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ol>
    <h2> An unordered html List</h2>
    <ul>
        <li>item</li>
        <li>item</li>
        <li>item</li>
    </ul>
    <h3> A definition list</h3>
    <dl>
        <dt>tea</dt>
        <dd>hot drink</dd>
        <dt>juice</dt>
        <dd>ice drink</dd>
    </dl>
</body>
</html>
